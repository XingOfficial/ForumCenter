name: .NET MAUI CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload restore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > forumcenter.jks
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Publish APK (signed)
        run: dotnet publish -f net9.0-android -c Release -p:AndroidPackageFormat=apk --no-restore
        env:
          AndroidSigningKeyStore: forumcenter.jks
          AndroidSigningStorePass: ${{ secrets.KEYSTORE_PASSWORD }}
          AndroidSigningKeyAlias: ${{ secrets.KEY_ALIAS }}
          AndroidSigningKeyPass: ${{ secrets.KEY_PASSWORD }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/Release/net9.0-android/publish/*.apk
